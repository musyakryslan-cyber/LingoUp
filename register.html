<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - LingoUp</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e3a8a;
            --primary-green: #10b981;
            --bg-light-blue: #e0f2fe;
            --text-dark: #334155;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: var(--white);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-blue);
            text-decoration: none;
            display: block;
            margin-bottom: 2rem;
        }

        .logo span {
            color: var(--primary-green);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        .btn-primary {
            background-color: var(--primary-green);
            color: var(--white);
            padding: 0.75rem;
            border: none;
            border-radius: 50px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }

        .auth-footer {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="index.html" class="logo">Lingo<span>Up</span></a>
        <h2 style="margin-bottom: 1.5rem; color: var(--primary-blue);">Створити акаунт</h2>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Ім'я</label>
                <input type="text" id="name" placeholder="Введіть ім'я" required>
            </div>

            <div class="form-group">
                <label for="surname">Прізвище</label>
                <input type="text" id="surname" placeholder="Введіть прізвище" required>
            </div>
            
            <div class="form-group">
                <label for="email">Електронна пошта</label>
                <input type="email" id="email" placeholder="Введіть email" required>
            </div>

            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" placeholder="+380970553310" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Створіть пароль" required>
            </div>
            
            <button type="submit" class="btn-primary">Зареєструватися</button>
        </form>

        <div class="auth-footer">
            Вже маєте акаунт? <a href="login.html">Увійти</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const user = {
                name: document.getElementById('name').value,
                surname: document.getElementById('surname').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(user)
                });
                
                const result = await response.json();
                if (result.success) {
                    // Зберігаємо сесію на клієнті (без пароля)
                    delete user.password;
                    localStorage.setItem('lingoup_user', JSON.stringify(user));
                    window.location.href = 'profile.html';
                } else {
                    alert(result.error || 'Помилка реєстрації');
                }
            } catch (err) {
                alert('Помилка з\'єднання з сервером');
            }
        });
    </script>
</body>
</html>
