<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - LingoUp</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e3a8a;
            --primary-green: #10b981;
            --bg-light-blue: #e0f2fe;
            --text-dark: #334155;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: var(--white);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-blue);
            text-decoration: none;
            display: block;
            margin-bottom: 2rem;
        }

        .logo span {
            color: var(--primary-green);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin: 0.5rem 0 1rem;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .remember-row label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }

        .remember-row input {
            width: 1rem;
            height: 1rem;
            accent-color: var(--primary-green);
        }

        .btn-primary {
            background-color: var(--primary-green);
            color: var(--white);
            padding: 0.75rem;
            border: none;
            border-radius: 50px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
        }

        .auth-footer {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="index.html" class="logo">Lingo<span>Up</span></a>
        <h2 style="margin-bottom: 1.5rem; color: var(--primary-blue);">Увійти</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Електронна пошта</label>
                <input type="email" id="email" placeholder="Введіть email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введіть пароль" required>
            </div>

            <div class="remember-row">
                <label for="rememberMe">
                    <input type="checkbox" id="rememberMe">
                    Зберігати пароль
                </label>
            </div>
            
            <button type="submit" class="btn-primary">Увійти</button>
        </form>
        <p id="authStatus" role="status" aria-live="polite"></p>

        <div class="auth-footer">
            Немає акаунта? <a href="register.html">Зареєструватися</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js?v=2"></script>
    <script>
        const EMAIL_STORAGE_KEY = 'lingoup-login-email';
        const PASSWORD_STORAGE_KEY = 'lingoup-login-password';
        const REMEMBER_STORAGE_KEY = 'lingoup-login-remember';

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeInput = document.getElementById('rememberMe');

        const remembered = localStorage.getItem(REMEMBER_STORAGE_KEY) === 'true';
        if (remembered) {
            emailInput.value = localStorage.getItem(EMAIL_STORAGE_KEY) || '';
            passwordInput.value = localStorage.getItem(PASSWORD_STORAGE_KEY) || '';
            rememberMeInput.checked = true;
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = e.currentTarget;
            const button = form.querySelector('button[type="submit"]');
            const status = document.getElementById('authStatus');
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const shouldRemember = rememberMeInput.checked;

            button.disabled = true;
            status.textContent = 'Входимо...';

            try {
                const { error } = await LingoUp.getClient().auth.signInWithPassword({
                    email,
                    password
                });
                if (error) {
                    throw error;
                }

                if (shouldRemember) {
                    localStorage.setItem(EMAIL_STORAGE_KEY, email);
                    localStorage.setItem(PASSWORD_STORAGE_KEY, password);
                    localStorage.setItem(REMEMBER_STORAGE_KEY, 'true');
                } else {
                    localStorage.removeItem(EMAIL_STORAGE_KEY);
                    localStorage.removeItem(PASSWORD_STORAGE_KEY);
                    localStorage.removeItem(REMEMBER_STORAGE_KEY);
                }

                window.location.href = 'profile.html';
            } catch (error) {
                status.textContent = error.message || 'Не вдалося увійти.';
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
